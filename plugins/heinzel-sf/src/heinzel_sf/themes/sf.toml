# SF's look for the Heinzelmännchen web app (heinzel ADR 0044), after the vendor's web console: a near-black blue-grey
# canvas with a slightly lighter sidebar, hairline borders, one strong blue for primary actions and a blue-tinted
# active item; the light variant is white, sidebar included, with grey hairlines and a light blue active pill.
# Both modes are measured from the console (see the plugin README); the derived tokens are tuned to them.
# Every value becomes a CSS custom property; Heinzelmännchen checks each one when this plugin is imported.
# Inter ships with the theme (fonts/, SIL OFL 1.1, see fonts/LICENSE.txt); the web app serves it from its own origin.
name = "sf"
title = "SF"
font_sans = 'Inter, -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
font_mono = '"SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace'
border_width = "1px"

# Type scale and density, measured from the console: 14px text, 12px secondary text, 30px navigation rows, 16px icons.
font_size = "14px"
font_size_small = "12px"
heading_weight = 550
heading_tracking = "-0.5px"
icon_size = "16px"
row_height = "30px"
spacing = "0.25rem"
radius_control = "0.375rem" # buttons, inputs, navigation items: 6px
radius = "0.5rem"           # cards and dialogs: 8px

[[fonts]]
family = "Inter"
file = "fonts/InterVariable.woff2"
weight = "100 900"
style = "normal"

[[fonts]]
family = "Inter"
file = "fonts/InterVariable-Italic.woff2"
weight = "100 900"
style = "italic"

# The vendor's logo in its own blue; it reads on both sidebars (7.2:1 on the dark one), so dark uses the light file.
[logo]
light = "logo/wordmark-light.svg"
mark = "logo/mark.svg"
alt = "Snowflake"
height = "24px"

[light]
# Measured from the console's light mode: a white page and a white sidebar with a hairline right border.
background = "#ffffff"
foreground = "#23272c"
muted = "#eeeff1"            # measured: hover and quiet panels
muted_foreground = "#626c7e"
card = "#ffffff"
border = "#d7dbe1"
primary = "#276ee1"          # measured: primary buttons
primary_foreground = "#ffffff"
accent = "#e3efff"           # measured: the active navigation pill
ok = "#16794a"
warn = "#9a5b00"
bad = "#c4302b"
ring = "#276ee1"
sidebar = "#ffffff"
input = "#ffffff"
popover = "#ffffff"
accent_foreground = "#2365d1" # measured: the active item's text and icon, links
icon = "#23272c"              # measured: navigation icons are in the text colour
main_tint = "#eef5fd"         # measured: the light blue at the top of the main area, fading to white

[dark]
background = "#16181d"
foreground = "#d7dbe1"
muted = "#1c2027"
muted_foreground = "#979fab"
card = "#16181d"
border = "#23272c"
primary = "#2365d1"
primary_foreground = "#ffffff"
accent = "#233554"
ok = "#4cb782"
warn = "#e3a53c"
bad = "#ef6461"
ring = "#2365d1"
sidebar = "#191e24"
input = "#2d333b"
popover = "#1c2027"
accent_foreground = "#71aaff" # measured: the active item's text and icon, links
icon = "#d7dbe1"              # measured: navigation icons are in the text colour

# The core drawing stays personal; its default colours and winter decoration follow this theme (core ADR 0064).
[heinzel]
decorations = ["snow"]

[heinzel.palette]
hat = "#dceaf5"
shirt = "#386387"
scarf = "#b7daed"
